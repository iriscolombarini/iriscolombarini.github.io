<style>
*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  height: 100%;
  margin: 0;
}

body {
  font-family: "Space Grotesk", system-ui, sans-serif;
  background: #fff;
  color: #000;
  overflow: hidden;
  display: grid;
  grid-template-rows: auto 1fr auto;
  min-height: 100dvh;
  padding: clamp(0.75rem, 2.5vw, 1.25rem);
  gap: 0.5rem;
}

.title {
  font-family: "Barrio", system-ui;
  font-weight: 400;
  font-style: normal;
  font-size: clamp(1.5rem, 4.5vw, 3rem);
  line-height: 1;
  letter-spacing: -0.03em;
  z-index: 2;
}

.info {
  font-weight: 400;
  font-size: clamp(0.75rem, 1.6vw, 1rem);
  line-height: 1.15;
  letter-spacing: -0.02em;
  z-index: 2;
}

.info p {
  margin: 0 0 0.85em;
}

.info p:last-child {
  margin-bottom: 0;
}

a {
  color: inherit;
  text-decoration: none;
  transition: color 0.2s;
}

a:hover {
  color: #c62828;
}

.line {
  display: block;
  width: fit-content;
  max-width: 100%;
  overflow-wrap: anywhere;
  transition: color 0.2s;
  cursor: default;
}

.logo {
  display: block;
  width: clamp(3rem, 7vw, 4.5rem);
  height: auto;
  margin-top: 1.1em;
}

.stage {
  display: grid;
  place-items: center;
  justify-items: end;
  min-height: 0;
  width: 100%;
}

.media {
  width: min(66vmin, 560px);
  max-height: 70dvh;
  height: auto;
  display: block;
  object-fit: contain;
  background: #fff;
  transform: translateY(-7dvh);
  mix-blend-mode: multiply;
}

@media (max-width: 600px) {
  body {
    padding: 1rem;
  }

  .stage {
    justify-items: start;
  }

  .media {
    width: min(80vmin, 420px);
  }
}
</style>
